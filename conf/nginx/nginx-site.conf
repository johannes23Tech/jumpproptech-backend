# JumpPropTech - nginx site configuration
#
# The base image (richarvey/nginx-php-fpm) copies this file over
# /etc/nginx/sites-available/default.conf at container start when it exists at
# /var/www/html/conf/nginx/nginx-site.conf. Without it, the hardening snippet
# in deploy/nginx-security.conf is copied into the image but never included.
#
# Keep the parts this replaces (root, index, logging, 404 page) in sync with
# the upstream conf/nginx-site.conf.

server {
    listen 80;
    listen [::]:80 default ipv6only=on;

    root /var/www/html;
    index index.php index.html index.htm;

    server_name _;

    # Disable sendfile (virtualbox/synced-folder safe, matches upstream).
    sendfile off;

    # Log to the container stdout/stderr so the platform can collect it.
    error_log /dev/stdout info;
    access_log /dev/stdout;

    # -----------------------------------------------------------------------
    # All web-server hardening: security headers, dotfile/secret blocking,
    # internals deny rules, request limits and the PHP-FPM location block.
    # Defined once in deploy/nginx-security.conf.
    # -----------------------------------------------------------------------
    include /etc/nginx/snippets/jumpproptech-security.conf;

    # ACME HTTP-01 challenges must stay reachable over plain HTTP. The ^~
    # prefix wins over the snippet's dotfile regex.
    location ^~ /.well-known/ {
        try_files $uri =404;
        access_log off;
    }

    location / {
        # First attempt to serve the request as a file, then as a directory,
        # otherwise return 404. There is no SPA fallback on the API host.
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        root /var/www/errors;
        internal;
    }

    location ^~ /sad.svg {
        alias /var/www/errors/sad.svg;
        access_log off;
    }

    location ^~ /twitter.svg {
        alias /var/www/errors/twitter.svg;
        access_log off;
    }

    location ^~ /github.svg {
        alias /var/www/errors/github.svg;
        access_log off;
    }
}
