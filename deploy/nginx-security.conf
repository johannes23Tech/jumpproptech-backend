# JumpPropTech - nginx security snippet
#
# Include this file inside the `server { ... }` block that serves the API,
# before the main `location /` block:
#
#     include /etc/nginx/snippets/jumpproptech-security.conf;
#
# The production image is nginx-based, so .htaccess is ignored. These rules are
# the authoritative web-server controls.

# ---------------------------------------------------------------------------
# Hide version banners
# ---------------------------------------------------------------------------
server_tokens off;
fastcgi_hide_header X-Powered-By;

# ---------------------------------------------------------------------------
# Block secrets, VCS metadata, dumps and build files
# ---------------------------------------------------------------------------
location ~ /\.(?!well-known) {
    deny all;
    access_log off;
    log_not_found off;
}

location ~* \.(env|sql|log|bak|ini|sh|swp|dist|md|pem|crt|key)$ {
    deny all;
    access_log off;
    log_not_found off;
}

# Application internals are only ever included by PHP. Never serve them
# directly over HTTP, even if a future rewrite rule would otherwise match.
location ^~ /config/     { deny all; access_log off; log_not_found off; }
location ^~ /middleware/ { deny all; access_log off; log_not_found off; }
location ^~ /migrations/ { deny all; access_log off; log_not_found off; }
location ^~ /vendor/     { deny all; access_log off; log_not_found off; }
location ^~ /deploy/     { deny all; access_log off; log_not_found off; }
location ^~ /conf/       { deny all; access_log off; log_not_found off; }

location ~* /(composer\.(json|lock)|README\.md|Dockerfile|docker-compose\.ya?ml|\.dockerignore)$ {
    deny all;
    access_log off;
    log_not_found off;
}

# The cron endpoint must not be reachable from the public internet. If your
# scheduler runs off-box, replace this with the scheduler's egress addresses.
location = /api/cron/generate_invoices.php {
    allow 127.0.0.1;
    allow ::1;
    deny all;

    # The cron secret travels in a header, but keep this endpoint out of
    # access logs as defence in depth.
    access_log off;

    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_param SCRIPT_NAME $fastcgi_script_name;
    fastcgi_pass unix:/var/run/php-fpm.sock;
}

# ---------------------------------------------------------------------------
# Security headers (also emitted by config/config.php as defence in depth)
# ---------------------------------------------------------------------------
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; base-uri 'none'" always;
add_header Cross-Origin-Resource-Policy "same-site" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# ---------------------------------------------------------------------------
# Request limits
# ---------------------------------------------------------------------------
client_max_body_size 12m;
client_body_timeout 15s;
client_header_timeout 15s;
send_timeout 30s;

# Do not serve PHP files as static text if PHP-FPM is misconfigured.
location ~ \.php$ {
    try_files $uri =404;
    fastcgi_split_path_info ^(.+\.php)(/.+)$;
    fastcgi_index index.php;

    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_param SCRIPT_NAME $fastcgi_script_name;
    fastcgi_pass unix:/var/run/php-fpm.sock;
}
