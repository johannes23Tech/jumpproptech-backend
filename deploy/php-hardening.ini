; JumpPropTech - PHP runtime hardening
; Copied into the image at /usr/local/etc/php/conf.d/99-security.ini.
; APP_ENV=production is still required so the application also disables
; verbose errors.

expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
html_errors = Off

; Never trust user-supplied Host headers in generated URLs.
; (The application does not currently generate absolute URLs from Host.)
allow_url_include = Off

; Upload/request limits. Keep in sync with nginx client_max_body_size.
memory_limit = 256M
post_max_size = 12M
upload_max_filesize = 10M
max_execution_time = 30
max_input_time = 30
max_input_vars = 2000

; Session hardening (only relevant if a session is introduced later).
session.use_strict_mode = 1
session.use_only_cookies = 1
session.cookie_httponly = 1
session.cookie_secure = 1
session.cookie_samesite = "Lax"
